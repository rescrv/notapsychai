[package]
name = "labradormail"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"

[dependencies]
agent-inbox-protocol = { path = "../agent-inbox-protocol", features = ["client", "server"] }
axum = { workspace = true }
async-trait = "0.1"
chrono = { workspace = true }
claudius = { version = "0.16", path = "../../claudius" }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
bitflags = "2"
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
unicode-width = "0.2"
rc_conf = "0.13.0"
