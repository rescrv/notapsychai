[workspace]
resolver = "2"
members = [
    "agent-inbox-protocol",
    "cadence",
    "labradormail",
    "orgremode",
]

[workspace.dependencies]
argon2 = "0.5.3"
arrrg = "0.8.0"
arrrg_derive = "0.8.0"
async-trait = "0.1"
axum = "0.8.8"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
claudius = "0.19.0"
crossterm = "0.29.0"
ctrlc = { version = "3.5", features = ["termination"] }
dirs = "6.0.0"
edit = "0.1.5"
getopts = "0.2.24"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
one_two_eight = "0.10.0"
ratatui = "0.30.0"
reqwest = { version = "0.12.28", features = ["json"] }
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
shvar = "0.8"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.8", features = ["cors"] }
utf8path = "0.9"
uuid = { version = "1.19.0", features = ["v4", "v7"] }

[profile.dev]
panic = "abort"

[profile.release]
debug = true
lto = true
opt-level = 2
panic = "abort"

[profile.test]
debug = true
opt-level = 2
