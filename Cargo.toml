[package]
name = "notapsychai"
version = "0.1.0"
authors = ["Robert Escriva <robert@rescrv.net>"]
edition = "2021"
description = "notapsychai is not a psychiatrist; more like an ai-powered human-centric SRE"
license = "Apache-2.0"
repository = "https://github.com/rescrv/notapsychai"

[dependencies]
argon2 = "0.5"
arrrg = "0.5"
arrrg_derive = "0.5"
async-trait = "0.1.88"
axum = "0.7"
chrono = { version = "0.4.39", features = ["clock", "serde"] }
chrono-tz = { version = "0.10.4", features = ["case-insensitive", "serde"] }
dirs = "5.0"
getopts = "0.2"
jsonwebtoken = "9.3"
libc = "0.2.174"
one_two_eight = "0.9.0"
reqwest = { version = "0.12", features = ["json"] }
rpassword = "7.3"
rustyline = { version = "16.0.0", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1.43.0", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
utf8path = "0.9.1"
uuid = { version = "1.11", features = ["serde", "v4"] }
